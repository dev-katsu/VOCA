<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VOCA - Login</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="text/javascript" src="/eel.js"></script>
</head>
<body>

  <div class="page">

    <!-- LEFT: big wordmark -->
    <div class="hero">
      <img src="img/voca-wordmark.png" alt="VOCA - Vision of Classroom Activity" class="hero-img">
    </div>

    <!-- RIGHT: login card -->
    <div class="card">

      <img src="img/voca-logo.png" alt="VOCA logo" class="brand-mark-img">
      <h1 class="brand-title">VOCA</h1>
      <p class="brand-sub">Vision of Classroom Activity</p>
      <p class="brand-sub2">City College of Calamba &nbsp;-&nbsp; Department of Computing and Informatics</p>

      <div class="panel">
        <h2 class="panel-title">Authorized Personnel Login</h2>
        <p class="panel-desc">Access restricted to authorized administrators.</p>

        <label class="field-label" for="username">Username</label>
        <div class="input-pill">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="14" height="14">
              <path fill="#fff" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-9 2.2-9 6v2h18v-2c0-3.8-4.6-6-9-6Z"/>
            </svg>
          </span>
          <input id="username" type="text" placeholder="Enter username or email" autocomplete="username">
        </div>

        <label class="field-label" for="password">Password</label>
        <div class="input-pill">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="14" height="14">
              <path fill="#fff" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm0 2a3 3 0 0 1 3 3v3H9V7a3 3 0 0 1 3-3Z"/>
            </svg>
          </span>
          <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">
        </div>

        <label class="show-pw">
          <input type="checkbox" id="showPw"> Show password
        </label>

        <p class="error-msg" id="errorMsg"></p>

        <button class="login-btn" id="loginBtn">LOG IN</button>
      </div>

      <p class="login-foot">Don't have an account? <a href="signup.html">Sign Up</a></p>
      <p class="footer-note">&copy; 2026 VOCA System &nbsp;-&nbsp; BS Computer Science</p>
    </div>

  </div>

<script src="js/login.js"></script>
</body>
</html>
