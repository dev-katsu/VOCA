<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VOCA - Sign Up</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="text/javascript" src="/eel.js"></script>
</head>
<body class="signup-body">

  <div class="signup-page">

    <!-- TOP: wordmark -->
    <div class="signup-topbar">
      <img src="img/voca-wordmark.png" alt="VOCA - Vision of Classroom Activity">
    </div>

    <!-- SIGN UP CARD -->
    <div class="signup-card">

      <div class="signup-head">
        <svg class="signup-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="18" r="10" fill="#1c1e1f"/>
          <path fill="#1c1e1f" d="M6 54c0-11 9-18 20-18s20 7 20 18v2H6v-2Z"/>
          <circle cx="49" cy="46" r="12" fill="#1c1e1f"/>
          <path fill="#a3b1b3" d="M49 39v14M42 46h14" stroke="#a3b1b3" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div>
          <h2>Create New Account</h2>
          <p>Register your faculty account to use VOCA</p>
        </div>
      </div>

      <div class="signup-body">

        <label class="field-label" for="fullname">Full Name</label>
        <div class="input-pill">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="14" height="14">
              <path fill="#fff" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-9 2.2-9 6v2h18v-2c0-3.8-4.6-6-9-6Z"/>
            </svg>
          </span>
          <input id="fullname" type="text" placeholder="Enter your full name" autocomplete="name">
        </div>

        <label class="field-label" for="facultyId">Faculty ID</label>
        <div class="input-pill">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="14" height="14">
              <path fill="#fff" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-9 2.2-9 6v2h18v-2c0-3.8-4.6-6-9-6Z"/>
            </svg>
          </span>
          <input id="facultyId" type="text" placeholder="Enter your faculty ID" autocomplete="username">
        </div>

        <label class="field-label" for="password">Password</label>
        <div class="input-pill">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="14" height="14">
              <path fill="#fff" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm0 2a3 3 0 0 1 3 3v3H9V7a3 3 0 0 1 3-3Z"/>
            </svg>
          </span>
          <input id="password" type="password" placeholder="Enter password" autocomplete="new-password">
        </div>
        <label class="show-pw">
          <input type="checkbox" id="showPw1"> Show password
        </label>

        <label class="field-label" for="confirmPassword">Confirm Password</label>
        <div class="input-pill">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="14" height="14">
              <path fill="#fff" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm0 2a3 3 0 0 1 3 3v3H9V7a3 3 0 0 1 3-3Z"/>
            </svg>
          </span>
          <input id="confirmPassword" type="password" placeholder="Re-enter password" autocomplete="new-password">
        </div>
        <label class="show-pw">
          <input type="checkbox" id="showPw2"> Show password
        </label>

        <p class="error-msg" id="errorMsg"></p>
        <p class="success-msg" id="successMsg"></p>

        <button class="create-btn" id="createBtn">CREATE ACCOUNT</button>
      </div>
    </div>

    <p class="signup-foot">Already have an account? <a href="login.html">Log In</a></p>

  </div>

<script src="js/signup.js"></script>
</body>
</html>
